[project]
name = "fisheye"
version = "0.1.0"
description = "Fisheye camera acquisition and GNSS time synchronization workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "av>=16,<19",
  "numpy>=2,<3",
  "Pillow>=12,<13",
  "pyserial>=3.5",
  "pyubx2>=1.3.6,<2",
]

[project.scripts]
fisheye = "fisheye.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
