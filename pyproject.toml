[project]
name = "fisheye-logging"
version = "0.1.0"
description = "Fisheye camera and GNSS timing logger"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyserial>=3.5",
  "pyubx2>=1.3.6,<2",
]

[project.scripts]
fisheye-logging = "fisheye_logging.__main__:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13"]
build-backend = "uv_build"
